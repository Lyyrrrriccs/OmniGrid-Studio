<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniGrid Studio — Anleitung &amp; Hilfe</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0b0f19;
      color: #e2e8f0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }
    .help-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 18px;
      background: #0f172a;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .help-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .help-tab {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: #cbd5e1;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .help-tab.active {
      background: rgba(145, 70, 255, 0.25);
      border-color: #9146ff;
      color: #ffffff;
    }
    .help-search {
      background: #020617;
      border: 1px solid rgba(255,255,255,0.14);
      color: #f8fafc;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      width: 210px;
      outline: none;
    }
    .help-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px 48px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      line-height: 1.65;
      font-size: 14px;
    }
    .help-body h1 { font-size: 24px; margin: 0 0 14px; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 8px; }
    .help-body h2 { font-size: 18px; margin: 26px 0 10px; color: #c4b5fd; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 5px; }
    .help-body h3 { font-size: 15px; margin: 18px 0 8px; color: #7dd3fc; }
    .help-body p { margin: 8px 0; }
    .help-body ul, .help-body ol { margin: 8px 0; padding-left: 22px; }
    .help-body li { margin: 4px 0; }
    .help-body code {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 1px 6px;
      border-radius: 5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
      color: #a5f3fc;
    }
    .help-body pre {
      background: #020617;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 12px 14px;
      overflow-x: auto;
      margin: 10px 0;
    }
    .help-body pre code { border: none; padding: 0; background: transparent; color: #e2e8f0; }
    .help-body blockquote {
      margin: 10px 0;
      padding: 8px 14px;
      border-left: 3px solid #9146ff;
      background: rgba(145, 70, 255, 0.1);
      border-radius: 0 8px 8px 0;
      color: #e2e8f0;
    }
    .help-body hr {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.1);
      margin: 22px 0;
    }
    .help-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 13px;
    }
    .help-body th, .help-body td {
      border: 1px solid rgba(255,255,255,0.12);
      padding: 7px 10px;
      text-align: left;
      vertical-align: top;
    }
    .help-body th {
      background: rgba(15, 23, 42, 0.9);
      color: #f8fafc;
    }
    .help-body a {
      color: #38bdf8;
      text-decoration: none;
    }
    .help-body a:hover { text-decoration: underline; }
    mark.hl { background: #f59e0b; color: #020617; padding: 0 2px; border-radius: 3px; }
  </style>
</head>
<body>
  <header class="help-header">
    <div class="help-tabs" id="helpTabs">
      <button class="help-tab active" data-doc="ANLEITUNG.md">📖 Anleitung (DE)</button>
      <button class="help-tab" data-doc="GUIDE.md">📘 Guide (EN)</button>
      <button class="help-tab" data-doc="README.de.md">⚡ Übersicht (DE)</button>
      <button class="help-tab" data-doc="README.md">🌐 Overview (EN)</button>
      <button class="help-tab" data-doc="PRIVACY.md">🔒 Datenschutz / Privacy</button>
      <button class="help-tab" data-doc="CHANGELOG.md">📋 Changelog</button>
    </div>
    <input type="search" class="help-search" id="helpSearch" placeholder="🔍 In Anleitung suchen..." />
  </header>
  <main class="help-body" id="helpContent">Lade Anleitung...</main>

  <script>
    const contentEl = document.getElementById('helpContent');
    const searchEl = document.getElementById('helpSearch');
    let currentRawMd = '';

    function escHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function inlineMd(text) {
      let s = escHtml(text);
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<strong>$1</strong>');
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      return s;
    }

    function renderMarkdown(md) {
      const lines = String(md || '').replace(/\r\n/g, '\n').split('\n');
      const out = [];
      let inCode = false;
      let codeLines = [];
      let listMode = null;
      let tableRows = [];

      const flushList = () => {
        if (listMode) {
          out.push(listMode === 'ul' ? '</ul>' : '</ol>');
          listMode = null;
        }
      };
      const flushTable = () => {
        if (tableRows.length === 0) return;
        let html = '<table><thead><tr>';
        tableRows[0].forEach((c) => { html += `<th>${inlineMd(c)}</th>`; });
        html += '</tr></thead><tbody>';
        for (let i = 1; i < tableRows.length; i++) {
          if (tableRows[i].every((c) => /^:?-+:?$/.test(c.trim()))) continue;
          html += '<tr>';
          tableRows[i].forEach((c) => { html += `<td>${inlineMd(c)}</td>`; });
          html += '</tr>';
        }
        html += '</tbody></table>';
        out.push(html);
        tableRows = [];
      };

      for (const line of lines) {
        if (line.trim().startsWith('```')) {
          flushList();
          flushTable();
          if (inCode) {
            out.push(`<pre><code>${escHtml(codeLines.join('\n'))}</code></pre>`);
            codeLines = [];
            inCode = false;
          } else {
            inCode = true;
          }
          continue;
        }
        if (inCode) {
          codeLines.push(line);
          continue;
        }

        const trimmed = line.trim();
        if (!trimmed) {
          flushList();
          flushTable();
          continue;
        }
        if (trimmed.startsWith('<div') || trimmed.startsWith('</div') || trimmed.startsWith('[![')) {
          continue;
        }
        if (/^---+$/.test(trimmed)) {
          flushList();
          flushTable();
          out.push('<hr />');
          continue;
        }
        if (trimmed.startsWith('|') && trimmed.endsWith('|')) {
          flushList();
          const cells = trimmed.slice(1, -1).split('|').map((c) => c.trim());
          tableRows.push(cells);
          continue;
        } else {
          flushTable();
        }

        const hMatch = trimmed.match(/^(#{1,3})\s+(.+)$/);
        if (hMatch) {
          flushList();
          const lvl = hMatch[1].length;
          out.push(`<h${lvl}>${inlineMd(hMatch[2])}</h${lvl}>`);
          continue;
        }
        if (trimmed.startsWith('>')) {
          flushList();
          out.push(`<blockquote>${inlineMd(trimmed.replace(/^>\s*/, ''))}</blockquote>`);
          continue;
        }
        const ulMatch = trimmed.match(/^[-*]\s+(.+)$/);
        if (ulMatch) {
          if (listMode !== 'ul') {
            flushList();
            out.push('<ul>');
            listMode = 'ul';
          }
          out.push(`<li>${inlineMd(ulMatch[1])}</li>`);
          continue;
        }
        const olMatch = trimmed.match(/^\d+\.\s+(.+)$/);
        if (olMatch) {
          if (listMode !== 'ol') {
            flushList();
            out.push('<ol>');
            listMode = 'ol';
          }
          out.push(`<li>${inlineMd(olMatch[1])}</li>`);
          continue;
        }

        flushList();
        out.push(`<p>${inlineMd(trimmed)}</p>`);
      }

      flushList();
      flushTable();
      return out.join('\n');
    }

    function applyFilterAndRender() {
      const q = searchEl.value.trim();
      let html = renderMarkdown(currentRawMd);
      if (q.length >= 2) {
        const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(`(${escaped})(?![^<]*>)`, 'gi');
        html = html.replace(re, '<mark class="hl">$1</mark>');
      }
      contentEl.innerHTML = html;
      if (q.length >= 2) {
        const firstMark = contentEl.querySelector('mark.hl');
        if (firstMark) firstMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    async function loadDoc(docName) {
      contentEl.textContent = 'Lade...';
      const res = await window.omnichat.getHelpDoc(docName);
      if (res?.ok) {
        currentRawMd = res.content;
        applyFilterAndRender();
        contentEl.scrollTop = 0;
      } else {
        contentEl.textContent = res?.error || 'Anleitung konnte nicht geladen werden.';
      }
    }

    document.querySelectorAll('.help-tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.help-tab').forEach((b) => b.classList.toggle('active', b === btn));
        loadDoc(btn.dataset.doc);
      });
    });

    searchEl.addEventListener('input', applyFilterAndRender);

    function activateDocTab(docName) {
      document.querySelectorAll('.help-tab').forEach((b) => b.classList.toggle('active', b.dataset.doc === docName));
      loadDoc(docName);
    }

    if (window.omnichat?.i18nGet) {
      window.omnichat.i18nGet().then((b) => {
        const isEn = b?.lang === 'en';
        document.title = isEn ? 'OmniGrid Studio — User Guide & Help' : 'OmniGrid Studio — Anleitung & Hilfe';
        searchEl.placeholder = isEn ? '🔍 Search guide...' : '🔍 In Anleitung suchen...';
        activateDocTab(isEn ? 'GUIDE.md' : 'ANLEITUNG.md');
      }).catch(() => activateDocTab('ANLEITUNG.md'));
      window.omnichat.onI18nChanged?.((b) => {
        const isEn = b?.lang === 'en';
        document.title = isEn ? 'OmniGrid Studio — User Guide & Help' : 'OmniGrid Studio — Anleitung & Hilfe';
        searchEl.placeholder = isEn ? '🔍 Search guide...' : '🔍 In Anleitung suchen...';
        activateDocTab(isEn ? 'GUIDE.md' : 'ANLEITUNG.md');
      });
    } else {
      activateDocTab('ANLEITUNG.md');
    }
  </script>
</body>
</html>
