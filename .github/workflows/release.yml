name: Build & Release OmniGrid Studio

on:
  push:
    branches:
      - master
      - main
      - features
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: ver
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            RAW_TAG="$REF_NAME"
            echo "version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            VER=$(node -e "console.log(require('./scripts/bump_version').formatDateTimeVersion())")
            echo "version=$VER" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: prepare-version
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      OMNIGRID_BUILD_VERSION: ${{ needs.prepare-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Zero-Telemetry & Outbound Domain Audit
        run: node scripts/audit_privacy.js
      - run: npm run build:win
      - name: Package Windows ZIP & SHA-256 Checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist/OmniGridStudio-win32-x64/* -DestinationPath OmniGridStudio-Windows.zip
          $hash = (Get-FileHash OmniGridStudio-Windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  OmniGridStudio-Windows.zip" | Out-File -Encoding utf8 OmniGridStudio-Windows.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            OmniGridStudio-Windows.zip
            OmniGridStudio-Windows.zip.sha256

  build-macos:
    needs: prepare-version
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      OMNIGRID_BUILD_VERSION: ${{ needs.prepare-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Zero-Telemetry & Outbound Domain Audit
        run: node scripts/audit_privacy.js
      - run: npm run build:mac
      - name: Package macOS ZIP & SHA-256 Checksum
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/OmniGridStudio.app OmniGridStudio-macOS.zip
          shasum -a 256 OmniGridStudio-macOS.zip > OmniGridStudio-macOS.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: |
            OmniGridStudio-macOS.zip
            OmniGridStudio-macOS.zip.sha256

  publish-release:
    needs: [prepare-version, build-windows, build-macos]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-dist'
          merge-multiple: true
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest-build' }}
          name: OmniGrid Studio v${{ needs.prepare-version.outputs.version }}
          make_latest: true
